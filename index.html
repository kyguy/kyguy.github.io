<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kyle's GitHub Activity</title>

  <!-- LinkedIn preview metadata -->
  <meta property="og:title" content="Kyle's GitHub Activity">
  <meta property="og:description" content="Live GitHub contribution heatmap and developer activity">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://kyguy.github.io/">

  <!-- This is what LinkedIn will try to show -->
  <meta property="og:image" content="https://kyguy.github.io/assets/linkedin-preview.png">

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0d1117;
      color: white;
      text-align: center;
      padding: 40px;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .heatmap {
      display: block;
      width: 100%;
      max-width: 950px;
      margin: 0 auto;
    }

    .button {
      display: inline-block;
      margin: 20px auto 0 auto;
      padding: 8px 16px;
      border-radius: 6px;
      background: #238636;
      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    .button:hover {
      background: #2ea043;
    }

    .subtitle {
      color: #8b949e;
    }

  </style>
</head>

<body>

<div class="card">

  <h1>
    Kyle's GitHub Activity
  </h1>

  <!--
  <p class="subtitle">
    Open source Contributions
  </p>
  -->

  <img
    class="heatmap"
    src="assets/heatmap.svg"
    alt="GitHub contribution heatmap"
  >

  <a
    class="button"
    href="https://github.com/kyguy"
    target="_blank">
    View GitHub Profile 
  </a>

</div>

</body>
</html>
